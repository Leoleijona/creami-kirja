<style>
  :root {
    --bg: #F1F4F6;
    --surface: #FFFFFF;
    --surface-2: #E8EDF1;
    --ink: #17212B;
    --muted: #5D6B78;
    --line: #D6DDE3;
    --accent: #B5304F;
    --accent-ink: #FFFFFF;
    --accent-soft: #F7E4E9;
    --ok: #1F7A47;
    --ok-soft: #E1F2E8;
    --warn: #9A6206;
    --warn-soft: #FBF0D6;
    --no: #2F5F96;
    --no-soft: #E1EAF5;
    --toast-link: #FF9DB3;
    --cat-proteiini: #B5304F;
    --cat-bowl: #D97A2B;
    --cat-sorbetti: #C9457A;
    --cat-froyo: #4E8F6A;
    --cat-frappe: #7A5236;
    --cat-pirtelo: #3E6FA8;
    --cat-slushi: #2B8BB0;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "DM Mono", "Cascadia Mono", Consolas, monospace;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(23,33,43,.06), 0 6px 20px rgba(23,33,43,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F151B; --surface: #182129; --surface-2: #222D37; --ink: #EDF1F4; --muted: #9AA8B5; --line: #2C3946;
      --accent: #E45B7D; --accent-ink: #1A0A10; --accent-soft: #3A1F28;
      --ok: #5CBF87; --ok-soft: #1B3326; --warn: #E0A93A; --warn-soft: #3A2E12; --no: #7FAEE6; --no-soft: #1C2A3B; --toast-link: #B5304F;
      --cat-proteiini: #E45B7D; --cat-bowl: #F0964B; --cat-sorbetti: #E56C9C; --cat-froyo: #6FBF8E; --cat-frappe: #B88A6A; --cat-pirtelo: #6A9AD6; --cat-slushi: #56B3D6;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F151B; --surface: #182129; --surface-2: #222D37; --ink: #EDF1F4; --muted: #9AA8B5; --line: #2C3946;
    --accent: #E45B7D; --accent-ink: #1A0A10; --accent-soft: #3A1F28;
    --ok: #5CBF87; --ok-soft: #1B3326; --warn: #E0A93A; --warn-soft: #3A2E12; --no: #7FAEE6; --no-soft: #1C2A3B; --toast-link: #B5304F;
    --cat-proteiini: #E45B7D; --cat-bowl: #F0964B; --cat-sorbetti: #E56C9C; --cat-froyo: #6FBF8E; --cat-frappe: #B88A6A; --cat-pirtelo: #6A9AD6; --cat-slushi: #56B3D6;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ink); margin: 0; }
  body { font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.15; }
  p { margin: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }

  .app { max-width: 540px; margin: 0 auto; min-height: 100dvh; padding-bottom: 88px; }

  /* Header */
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 18px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .theme { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 13px; font-weight: 600; min-height: 36px; }
  .theme svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .theme .ic-sun { display: none; }
  :root[data-theme="dark"] .theme .ic-moon { display: none; }
  :root[data-theme="dark"] .theme .ic-sun { display: inline; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
  .seg button { padding: 7px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); min-height: 36px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  main { padding: 6px 18px 0; display: grid; gap: 22px; }
  section { display: grid; gap: 10px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .sec-head h2 { font-size: 20px; font-weight: 700; }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .link { color: var(--accent); font-weight: 600; font-size: 14px; min-height: 32px; }

  .greeting h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .greeting p { color: var(--muted); margin-top: 4px; }
  .banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--ink); font-size: 14px; }
  .banner b { color: var(--warn); }

  /* Cards */
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 8px; text-align: left; width: 100%; }
  .card.tap:active { transform: scale(.99); }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .cat::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cat-color, var(--muted)); }
  .card h3 { font-size: 18px; font-weight: 700; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--muted); }
  .prog { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; background: var(--surface-2); color: var(--ink); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .stars { color: var(--warn); letter-spacing: 1px; font-size: 13px; }
  .why { font-size: 12px; font-weight: 600; color: var(--accent); }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.new { background: var(--accent-soft); color: var(--accent); }

  .sugg { display: grid; gap: 10px; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 16px; border-radius: 12px; font-weight: 600; font-size: 15px; background: var(--surface-2); color: var(--ink); min-height: 44px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.no { background: var(--no-soft); color: var(--no); border: 1.5px solid var(--no); }
  .try .btn.no { background: transparent; color: var(--no); border-color: var(--no); }
  .btn.small { padding: 8px 12px; font-size: 14px; min-height: 36px; border-radius: 10px; }
  .btn.block { width: 100%; }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: default; }

  .empty { color: var(--muted); font-size: 15px; padding: 14px 16px; background: var(--surface); border-radius: var(--radius); border: 1px dashed var(--line); }

  /* Chips */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-size: 14px; font-weight: 600; color: var(--muted); min-height: 36px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); min-height: 44px; }
  .list { display: grid; gap: 10px; }

  /* Freezer */
  .frz { gap: 10px; }
  .frz .t { font-weight: 600; font-size: 17px; }
  .frz .sub { font-size: 13px; color: var(--muted); }
  .frz .row-actions { flex-wrap: nowrap; }
  .frz .row-actions .btn { flex: 1 1 auto; }
  .frz .row-actions .btn.icon { flex: 0 0 auto; }
  .btn.icon { min-width: 40px; padding: 8px 12px; }

  /* Shopping */
  .shop-item { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .shop-item:last-child { border-bottom: 0; }
  .shop-item input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--accent); margin: 0; }
  .shop-item .t { font-weight: 500; }
  .shop-item.done .t { text-decoration: line-through; color: var(--muted); }
  .shop-item .sub { font-size: 12px; color: var(--muted); }
  .addrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .pantry { font-size: 13px; color: var(--muted); line-height: 1.5; }

  /* Bottom nav */
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 0 max(8px, env(safe-area-inset-bottom)); }
  nav.tabs .in { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  nav.tabs button { display: grid; justify-items: center; gap: 2px; padding: 8px 0; font-size: 12px; font-weight: 600; color: var(--muted); position: relative; }
  nav.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button[aria-pressed="true"] { color: var(--accent); }
  nav.tabs .badge { position: absolute; left: calc(50% + 8px); top: 4px; background: var(--accent); color: var(--accent-ink); font-size: 10px; min-width: 16px; height: 16px; border-radius: 8px; display: grid; place-items: center; padding: 0 4px; }

  /* Detail sheet */
  .sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow-y: auto; }
  .sheet .in { max-width: 540px; margin: 0 auto; padding: 0 18px 130px; }
  .sheet-top { position: sticky; top: 0; background: var(--bg); padding: 12px 0; display: flex; align-items: center; gap: 8px; z-index: 2; }
  .sheet-top .back { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: var(--accent); padding: 8px 10px 8px 0; min-height: 44px; }
  .sheet-top .round { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; }
  .sheet-top .round svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .sheet-top .heart { margin-left: auto; }
  .sheet-top .heart[aria-pressed="true"] svg { fill: var(--accent); }
  .sheet-top .share svg { stroke: var(--muted); }
  .try { background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; box-shadow: var(--shadow); border-top: 3px solid var(--accent); }
  .try .eyebrow { color: var(--accent); }
  .try h3 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  .try .btn { background: var(--surface-2); color: var(--ink); }
  .try .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .hidden-list summary { cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 600; padding: 6px 0; list-style: none; }
  .hidden-list summary::-webkit-details-marker { display: none; }
  .hidden-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
  .hidden-row:last-child { border-bottom: 0; }
  .hero { display: grid; gap: 10px; padding: 6px 0 16px; }
  .hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .prog-big { display: inline-grid; gap: 2px; padding: 12px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); justify-self: start; }
  .prog-big .l { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; opacity: .7; }
  .prog-big .v { font-family: var(--mono); font-size: 20px; letter-spacing: .06em; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fact { background: var(--surface); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
  .fact .l { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .fact .v { font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
  .fact .v small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .ing { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .ing:last-child { border-bottom: 0; }
  .ing .n { font-weight: 500; }
  .ing .a { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; white-space: nowrap; }
  .ing .s { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  .ing .s::before { content: "Kaupasta: "; font-weight: 600; }
  .ing.home .s::before { content: "Kotona aina"; font-weight: 600; }
  .steps { display: grid; gap: 12px; counter-reset: s; }
  .steps li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; cursor: pointer; }
  .steps li::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 14px; }
  .steps li.done { color: var(--muted); }
  .steps li.done::before { content: "✓"; background: var(--ok-soft); color: var(--ok); }
  .steps li strong { font-family: var(--mono); font-weight: 500; font-size: 14px; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; }
  .steps-hint { font-size: 12px; color: var(--muted); }
  .tip { background: var(--accent-soft); color: var(--ink); padding: 12px 14px; border-radius: 12px; font-size: 15px; }
  .tip b { color: var(--accent); }
  .review { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .review:last-child { border-bottom: 0; }
  .review .h { display: flex; gap: 8px; align-items: center; font-size: 14px; flex-wrap: wrap; }
  .review .who { font-weight: 700; }
  .review .d { color: var(--muted); font-size: 12px; margin-left: auto; }
  .review .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .review .c { font-size: 15px; }
  .actionbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 11; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 18px max(12px, env(safe-area-inset-bottom)); }
  .actionbar .in { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actionbar .in.one { grid-template-columns: 1fr; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 20; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 18px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; display: flex; gap: 14px; align-items: center; width: max-content; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; pointer-events: auto; }
  .toast button { color: var(--toast-link); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 13px; padding: 6px 2px; flex: 0 0 auto; }

  /* Review modal + first-run chooser */
  .modal { position: fixed; inset: 0; z-index: 15; background: rgba(10,16,22,.55); display: grid; align-items: end; }
  .modal.center { align-items: center; padding: 18px; }
  .modal .box { background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px 18px max(18px, env(safe-area-inset-bottom)); max-width: 540px; width: 100%; margin: 0 auto; display: grid; gap: 16px; max-height: 92dvh; overflow-y: auto; }
  .modal.center .box { border-radius: 20px; }
  .modal h2 { font-size: 22px; }
  .q { display: grid; gap: 8px; }
  .q .l { font-weight: 600; font-size: 14px; }
  .starpick { display: flex; gap: 6px; }
  .starpick button { font-size: 34px; line-height: 1; color: var(--line); width: 48px; height: 48px; }
  .starpick button.on { color: var(--warn); }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opts button { padding: 9px 14px; border-radius: 999px; background: var(--surface-2); font-weight: 600; font-size: 14px; color: var(--muted); min-height: 40px; }
  .opts button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  textarea.note { width: 100%; min-height: 70px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); resize: vertical; }
  .who-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .who-pick .btn { min-height: 64px; font-size: 20px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <button class="theme" data-theme-toggle aria-label="Vaihda teema" title="Teema">
      <svg viewBox="0 0 24 24" class="ic-moon" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg viewBox="0 0 24 24" class="ic-sun" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <span class="lbl"></span>
    </button>
    <div class="seg" role="group" aria-label="Kuka käyttää">
      <button data-profile="leo" aria-pressed="true">Leo</button>
      <button data-profile="aiti" aria-pressed="false">Kirsi</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="Näkymät">
  <div class="in">
    <button data-tab="today" aria-pressed="true" id="todayTab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3.5"/></svg>Tänään
    </button>
    <button data-tab="recipes" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5V5.5M8 7h8M8 11h6"/></svg>Reseptit
    </button>
    <button data-tab="favs" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7.5 2.5c0 5.4-7.5 10-7.5 10z"/></svg>Suosikit
    </button>
    <button data-tab="shop" aria-pressed="false" id="shopTab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>Ostoslista
    </button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="overlay"></div>
<div id="who"></div>

<script>
(() => {
  const CATS = { proteiini: "Proteiinijäätelö", bowl: "Smoothie bowl", sorbetti: "Sorbetti", froyo: "Frozen yoghurt", frappe: "Frappé", pirtelo: "Pirtelö", slushi: "Slushi" };
  const PREF = { leo: ["proteiini", "froyo", "pirtelo"], aiti: ["bowl", "sorbetti", "frappe", "froyo"] };
  const NAMES = { leo: "Leo", aiti: "Kirsi" };
  const OTHER = { leo: "aiti", aiti: "leo" };
  const PROFILES = ["leo", "aiti"];
  const TEXTURE = ["liian kova", "murumainen", "täydellinen", "liian löysä"];
  const SWEET = ["liian vähän makea", "sopiva", "liian makea"];
  const PANTRY = "Kotona aina: Puhdistamo vanilja- ja suklaaproteiini, alluloosi, ksantaani, vaniljauute, maapähkinäjauhe, suola. Näitä ei lisätä listalle.";
  const DAY = 24 * 3600 * 1000;
  const EMPTY_PREFS = () => ({ hidden: [], favorites: [], kept: [], deleted: [] });

  const S = {
    profile: "leo", tab: "today", cat: "all", q: "",
    recipes: [], reviews: [], freezer: [], shopping: [],
    prefs: { leo: EMPTY_PREFS(), aiti: EMPTY_PREFS(), shared: EMPTY_PREFS() },
    db: null, dbState: "loading", open: null, review: null, seed: 0, busy: false, firstRun: false, stepsDone: new Set(),
  };
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  // Suggestions are stable for a calendar day (per person); "Arvo uudet" re-rolls them for the rest of that day.
  const daySeed = (who) => { const d = new Date(); let h = (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) + (who === "aiti" ? 7 : 3); h = Math.imul(h ^ (h >>> 15), 2246822519); h = Math.imul(h ^ (h >>> 13), 3266489917); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const seedKey = () => "creami.seed." + S.profile + "." + new Date().toDateString();
  const loadSeed = () => { const v = store.get(seedKey()); S.seed = v && Number.isFinite(+v) ? +v : daySeed(S.profile); };
  const savedProfile = store.get("creami.profile");
  if (PROFILES.includes(savedProfile)) S.profile = savedProfile; else S.firstRun = true;
  loadSeed();

  // Theme: "auto" follows the phone; "dark"/"light" lock it. Stored per device.
  const THEMES = ["auto", "dark", "light"], THEME_LABEL = { auto: "Auto", dark: "Tumma", light: "Vaalea" };
  let theme = store.get("creami.theme"); if (!THEMES.includes(theme)) theme = "auto";
  const darkMedia = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  const applyTheme = () => {
    if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
    const l = document.querySelector(".theme .lbl"); if (l) l.textContent = THEME_LABEL[theme];
    const dark = theme === "dark" || (theme === "auto" && darkMedia && darkMedia.matches);
    const m = document.getElementById("themeColor"); if (m) m.content = dark ? "#0F151B" : "#F1F4F6";
  };
  applyTheme();
  if (darkMedia && darkMedia.addEventListener) darkMedia.addEventListener("change", applyTheme);

  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (v) => { const n = typeof v === "string" ? parseFloat(v.replace(",", ".")) : Number(v); return Number.isFinite(n) ? n : null; };
  const fmtDay = (ts) => new Date(ts).toLocaleDateString("fi-FI", { weekday: "short", day: "numeric", month: "numeric" });
  const fmtWhen = (ts) => { const d = new Date(ts); return d.toLocaleDateString("fi-FI", { weekday: "short" }) + " klo " + d.toLocaleTimeString("fi-FI", { hour: "2-digit", minute: "2-digit" }); };
  const stars = (n) => { const k = Math.min(5, Math.max(0, Math.round(num(n) ?? 0))); return "★".repeat(k) + "☆".repeat(5 - k); };
  const byId = (id) => S.recipes.find((r) => r.id === id);
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  // Visibility per profile: proposals ("ehdotus") show only after "Pidetään"; hidden ones never.
  const prefsOf = (who) => S.prefs[who] || (S.prefs[who] = EMPTY_PREFS());
  const P = () => prefsOf(S.profile);
  const DELETED = () => prefsOf("shared").deleted;   // removed from the book for both
  const isDeleted = (r) => DELETED().includes(r.id);
  const isHidden = (r) => P().hidden.includes(r.id) || isDeleted(r);
  const KEPT = () => prefsOf("shared").kept;
  const isProposal = (r) => r.status === "ehdotus" && !KEPT().includes(r.id);
  const FAVS = () => prefsOf("shared").favorites;   // favourites are shared by the family
  const isFav = (r) => FAVS().includes(r.id);
  const visible = () => S.recipes.filter((r) => !isHidden(r) && !isProposal(r));
  // Recipes meant for this person (who lists them, or who is missing); used for suggestions only – the book itself shows everything.
  const forMe = (r) => !Array.isArray(r.who) || r.who.length === 0 || r.who.includes(S.profile);
  const mine = () => { const m = visible().filter(forMe); return m.length ? m : visible(); };
  const proposals = () => S.recipes.filter((r) => isProposal(r) && !isHidden(r)).sort((a, b) => (forMe(b) - forMe(a)) || (b.added || 0) - (a.added || 0));
  // toast(message) or toast(message, undoFn) – the undo variant stays up longer and offers "Kumoa".
  let toastT, toastUndo = null;
  const toast = (m, undo) => {
    const t = $("#toast"); toastUndo = undo || null;
    t.innerHTML = `<span>${esc(m)}</span>${undo ? `<button type="button" data-toast-undo>Kumoa</button>` : ""}`;
    t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), undo ? 7000 : 2000);
  };

  // ---------- Layers (recipe sheet, review modal) tied to browser history so the phone's back button closes them ----------
  const layers = [];
  const applyPop = (name) => { if (name === "review") S.review = null; else if (name === "sheet") { S.open = null; S.review = null; S.stepsDone = new Set(); } };
  const pushLayer = (name) => { layers.push(name); try { history.pushState({ creami: layers.length }, ""); } catch (e) {} };
  window.addEventListener("popstate", (e) => { const depth = (e.state && Number(e.state.creami)) || 0; while (layers.length > depth) applyPop(layers.pop()); render(); });
  try { if (history.state && history.state.creami) history.replaceState(null, ""); } catch (e) {}
  function closeTop() { const n = layers.pop(); if (n) { applyPop(n); try { history.back(); } catch (e) {} } else { S.review = null; S.open = null; } render(); }
  function closeAll() { const n = layers.length; while (layers.length) applyPop(layers.pop()); S.open = null; S.review = null; S.stepsDone = new Set(); if (n) { try { history.go(-n); } catch (e) {} } render(); }
  function openRecipe(id, review) {
    if (!byId(id)) return;
    if (!S.open) pushLayer("sheet");
    else if (S.review && layers[layers.length - 1] === "review") { layers.pop(); try { history.back(); } catch (e) {} }
    S.open = id; S.review = null; S.stepsDone = new Set();
    if (review) { S.review = review; pushLayer("review"); }
    render();
    const sh = $("#overlay .sheet"); if (sh) sh.scrollTop = 0;
    const b = $("#overlay .back"); if (b && !review) b.focus({ preventScroll: true });
  }
  function openReview(review) { if (S.review) return; S.review = review; pushLayer("review"); render(); }
  function closeReview() { if (layers[layers.length - 1] === "review") closeTop(); else { S.review = null; render(); } }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (S.review || S.open)) closeTop(); });

  // Keep the screen on while a recipe is open (hands are busy in the kitchen).
  let wake = null, wakeBusy = false;
  async function wakeSync() {
    if (wakeBusy || !navigator.wakeLock) return;
    const want = !!S.open && !document.hidden;
    wakeBusy = true;
    try {
      if (want && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); }
      else if (!want && wake) { const w = wake; wake = null; await w.release(); }
    } catch (e) { wake = null; }
    wakeBusy = false;
  }

  // Stats per recipe for one profile (plain maps so odd recipe ids can't touch Object.prototype)
  function stats(profile) {
    const m = Object.create(null);
    for (const r of S.reviews) {
      if (r.who !== profile) continue;
      const s = (m[r.recipeId] ||= { n: 0, sum: 0, last: 0 });
      s.n++; s.sum += r.stars; s.last = Math.max(s.last, r.at || 0);
    }
    for (const k in m) m[k].avg = m[k].sum / m[k].n;
    return m;
  }
  function allStats() {
    const m = Object.create(null);
    for (const r of S.reviews) { const s = (m[r.recipeId] ||= { n: 0, sum: 0 }); s.n++; s.sum += r.stars; }
    for (const k in m) m[k].avg = m[k].sum / m[k].n;
    return m;
  }
  function seededShuffle(arr, seed) {
    const a = arr.slice(); let x = Math.floor((seed % 1) * 2 ** 31) || 1;
    for (let i = a.length - 1; i > 0; i--) { x = (x * 48271) % 2147483647; const j = x % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function suggestions(seed = S.seed) {
    const st = stats(S.profile), pref = PREF[S.profile] || [];
    const out = [], used = new Set();
    const take = (r, why) => { if (r && !used.has(r.id)) { used.add(r.id); out.push({ r, why }); } };
    const pool = mine();
    take(tryThis(), "Uusin kirjassa");
    const rated = pool.filter((r) => st[r.id]);
    const fav = rated.filter((r) => st[r.id].avg >= 4 || isFav(r)).sort((a, b) => st[b.id].avg - st[a.id].avg || st[a.id].last - st[b.id].last)[0];
    take(fav, "Suosikkisi");
    const old = rated.filter((r) => !used.has(r.id)).sort((a, b) => st[a.id].last - st[b.id].last)[0];
    if (old && Date.now() - st[old.id].last > 5 * DAY) take(old, "Pitkästä aikaa");
    const fresh = seededShuffle(pool.filter((r) => !st[r.id]), seed)
      .sort((a, b) => (pref.indexOf(a.cat) === -1) - (pref.indexOf(b.cat) === -1));
    for (const r of fresh) { if (out.length >= 3) break; take(r, "Uusi kokeilu"); }
    for (const r of seededShuffle(pool, seed + 0.37)) { if (out.length >= 3) break; take(r, "Kokeile taas"); }
    return out;
  }
  // "Arvo uudet": pick a seed that actually changes the list (if the book is big enough for that)
  function reroll() {
    const cur = suggestions().map((s) => s.r.id).join();
    let seed = Math.random();
    for (let i = 0; i < 12; i++) { seed = Math.random(); if (suggestions(seed).map((s) => s.r.id).join() !== cur) break; }
    S.seed = seed; store.set(seedKey(), String(seed)); render();
  }
  // "Uusin kirjassa": the newest recipe this profile has kept but not yet rated
  function tryThis() {
    const st = stats(S.profile);
    return mine().filter((r) => !st[r.id] && r.added).sort((a, b) => b.added - a.added)[0] || null;
  }

  // ---------- Rendering ----------
  const catKey = (r) => (r.cat in CATS ? r.cat : "proteiini");
  function catChip(r) { return `<span class="cat" style="--cat-color: var(--cat-${catKey(r)})">${esc(CATS[r.cat] || r.cat)}</span>`; }
  const protein = (r) => (r.macros && r.macros.protein != null) ? `<span>${r.macros.protein} g prot.</span>` : "";
  function recipeCard(r, why) {
    const st = stats(S.profile)[r.id], all = allStats()[r.id];
    const whoDone = st ? `<span class="stars" title="${st.avg.toFixed(1)}">${stars(st.avg)}</span>` : `<span class="pill new">Uusi sinulle</span>`;
    const other = !st && all ? `<span class="pill">${NAMES[OTHER[S.profile]]}: ${stars(all.avg)}</span>` : "";
    const theirs = !forMe(r) ? `<span class="pill">${S.profile === "leo" ? "Kirsin" : "Leon"}</span>` : "";
    return `<button class="card tap" data-open="${esc(r.id)}">
      <div class="card-top">${catChip(r)}<span>${why ? `<span class="why">${esc(why)}</span> ` : ""}${isFav(r) ? `<span class="why" aria-label="Suosikki">♥</span>` : ""}</span></div>
      <h3>${esc(r.name)}</h3>
      <div class="meta"><span class="prog">${esc(r.program)}</span>${protein(r)}${whoDone}${other}${theirs}</div>
    </button>`;
  }
  function dbNote() {
    if (S.dbState === "loading") return `<div class="empty">Haetaan reseptejä…</div>`;
    if (S.dbState === "none") return `<div class="empty">Reseptikirjaan ei saatu yhteyttä. Tarkista nettiyhteys ja avaa sivu uudelleen.</div>`;
    if (!S.recipes.length) return `<div class="empty">Kirjassa ei ole vielä reseptejä.</div>`;
    return "";
  }
  const offlineBanner = () => S.dbState === "offline" ? `<div class="banner"><b>Ei yhteyttä.</b> Näytetään viimeksi haettu kirja – muutokset eivät tallennu ennen kuin netti palaa.</div>` : "";

  function renderToday() {
    const hour = new Date().getHours();
    const hello = hour < 10 ? "Huomenta" : hour < 17 ? "Päivää" : "Iltaa";
    const note = dbNote();
    const frz = S.freezer.slice().sort((a, b) => a.at - b.at);
    const frzHtml = frz.length ? frz.map((f) => {
      const r = byId(f.recipeId); if (!r) return "";
      const ready = f.at + DAY, isReady = Date.now() >= ready;
      return `<div class="card frz">
        <div><div class="t">${esc(r.name)}</div><div class="sub">${esc(NAMES[f.who] || "")} · laitettu ${fmtDay(f.at)} · ${isReady ? `<span class="pill ok">Valmis ajettavaksi</span>` : `valmis ${fmtWhen(ready)}`}</div></div>
        <div class="row-actions"><button class="btn small primary" data-done="${esc(f.id)}">Tehty – arvioi</button><button class="btn small" data-open="${esc(r.id)}">Avaa</button><button class="btn small ghost icon" data-unfreeze="${esc(f.id)}" aria-label="Poista pakkaslistalta" title="Poista pakkaslistalta">✕</button></div>
      </div>`;
    }).join("") : `<div class="empty">Ei mitään pakkasessa. Avaa resepti ja paina <b>Laita pakkaseen</b>, niin näet täältä milloin se on valmis.</div>`;
    const sugg = suggestions();
    const recent = S.reviews.slice().sort((a, b) => b.at - a.at).slice(0, 3);
    const props = proposals(), prop = props[0];
    const tryCard = (r, eyebrow, primary) => `<div class="try">
        <span class="eyebrow">${eyebrow}</span>
        ${catChip(r)}
        <h3>${esc(r.name)}</h3>
        <div class="meta"><span class="prog">${esc(r.program)}</span>${protein(r)}<span>${esc(r.time || "")}</span></div>
        ${r.tips ? `<p style="opacity:.85;font-size:14px">${esc(r.tips)}</p>` : ""}
        <div class="row-actions">${primary}<button class="btn" data-open="${esc(r.id)}">Avaa resepti</button><button class="btn no" data-hide="${esc(r.id)}">✕ Ei kiinnosta</button></div>
      </div>`;
    const topCard = prop ? `<section><div class="sec-head"><h2>Pidetäänkö resepti?</h2><span class="eyebrow">${props.length > 1 ? props.length + " uutta ehdotusta" : "uusi ehdotus"}</span></div>
        ${tryCard(prop, "Uusi ehdotus kirjaan", `<button class="btn primary" data-keep="${esc(prop.id)}">Pidetään</button>`)}</section>` : "";
    return `
      <section class="greeting"><h1>${hello}, ${NAMES[S.profile]}.</h1><p>${S.profile === "aiti" ? "Smoothie bowleja, sorbetteja ja frappéa – ja arvioi lopuksi, niin kirja oppii mistä tykkäät." : "Proteiinijäätelöä, jolla on oikeasti rakenne. Arvioi jokainen kokeilu."}</p></section>
      ${offlineBanner()}
      ${note ? "" : topCard}
      <section>
        <div class="sec-head"><h2>Pakkasessa nyt</h2></div>
        ${note || frzHtml}
      </section>
      <section>
        <div class="sec-head"><h2>Mitä tänään?</h2><button class="link" data-reroll>Arvo uudet</button></div>
        ${note || `<div class="sugg">${sugg.map((s) => recipeCard(s.r, s.why)).join("")}</div>`}
      </section>
      ${recent.length ? `<section><div class="sec-head"><h2>Viimeksi arvioitu</h2></div><div class="card">${recent.map(reviewRow).join("")}</div></section>` : ""}
    `;
  }
  function reviewRow(v) {
    const r = byId(v.recipeId);
    const canDelete = v.who === S.profile && Date.now() - v.at < 3600 * 1000;
    return `<div class="review"><div class="h"><span class="who">${esc(NAMES[v.who] || v.who)}</span><span class="stars">${stars(v.stars)}</span>${r ? `<button class="link" data-open="${esc(r.id)}">${esc(r.name)}</button>` : ""}<span class="d">${fmtDay(v.at)}${canDelete ? ` · <button class="link" data-unreview="${esc(v.id)}">Poista</button>` : ""}</span></div>
      <div class="tags">${v.texture ? `<span class="pill">${esc(v.texture)}</span>` : ""}${v.sweetness ? `<span class="pill">${esc(v.sweetness)}</span>` : ""}</div>${v.comment ? `<div class="c">${esc(v.comment)}</div>` : ""}</div>`;
  }

  function renderRecipes() {
    const note = dbNote();
    const pref = PREF[S.profile] || [];
    const q = S.q.trim().toLowerCase();
    const pool = visible();
    let list = pool.filter((r) => S.cat === "all" || r.cat === S.cat);
    if (q) list = list.filter((r) => (r.name + " " + (CATS[r.cat] || "") + " " + r.program + " " + r.ing.map((i) => i.n + " " + i.s).join(" ")).toLowerCase().includes(q));
    list.sort((a, b) => (pref.indexOf(a.cat) === -1) - (pref.indexOf(b.cat) === -1) || a.order - b.order);
    const chips = [["all", "Kaikki"], ...Object.entries(CATS)].map(([k, v]) => `<button class="chip" data-cat="${k}" aria-pressed="${S.cat === k}">${v}</button>`).join("");
    const hidden = S.recipes.filter((r) => P().hidden.includes(r.id) && !isDeleted(r));
    const deleted = S.recipes.filter(isDeleted);
    const hiddenHtml = (hidden.length ? `<details class="hidden-list"><summary>Piilotetut (${hidden.length}) ›</summary><div class="card">${hidden.map((r) => `<div class="hidden-row"><span>${esc(r.name)}</span><button class="btn small" data-unhide="${esc(r.id)}">Palauta</button></div>`).join("")}</div></details>` : "")
      + (deleted.length ? `<details class="hidden-list"><summary>Poistetut (${deleted.length}) ›</summary><div class="card">${deleted.map((r) => `<div class="hidden-row"><span>${esc(r.name)}</span><button class="btn small" data-undelete="${esc(r.id)}">Palauta</button></div>`).join("")}</div></details>` : "");
    return `
      <section>
        <div class="sec-head"><h2>Reseptit</h2><span class="eyebrow">${pool.length} kpl · 709 ml astia</span></div>
        ${offlineBanner()}
        <input class="search" type="search" placeholder="Hae nimellä tai aineksella…" value="${esc(S.q)}" data-search aria-label="Hae reseptejä">
        <div class="chips">${chips}</div>
        ${note || (list.length ? `<div class="list">${list.map((r) => recipeCard(r)).join("")}</div>` : `<div class="empty">Ei osumia.</div>`)}
        ${hiddenHtml}
      </section>`;
  }

  function renderFavs() {
    const note = dbNote();
    const st = stats(S.profile);
    const pool = visible();
    const hearts = pool.filter(isFav).sort((a, b) => (st[b.id]?.avg || 0) - (st[a.id]?.avg || 0));
    const top = pool.filter((r) => !isFav(r) && st[r.id] && st[r.id].avg >= 4).sort((a, b) => st[b.id].avg - st[a.id].avg);
    return `
      <section>
        <div class="sec-head"><h2>Suosikit</h2><span class="eyebrow">yhteiset</span></div>
        ${offlineBanner()}
        ${note || (hearts.length ? `<div class="list">${hearts.map((r) => recipeCard(r)).join("")}</div>` : `<div class="empty">Ei vielä sydämiä. Avaa resepti ja napauta ♥ oikeasta yläkulmasta – suosikit ovat teidän yhteisiä.</div>`)}
      </section>
      ${top.length ? `<section><div class="sec-head"><h2>Arvioit 4–5 tähteä</h2><span class="eyebrow">${NAMES[S.profile]}</span></div><div class="list">${top.map((r) => recipeCard(r)).join("")}</div></section>` : ""}`;
  }

  function renderShop() {
    const items = S.shopping;
    const open = items.filter((i) => !i.done), done = items.filter((i) => i.done);
    const row = (i) => `<label class="shop-item ${i.done ? "done" : ""}"><input type="checkbox" data-check="${esc(i.id)}" ${i.done ? "checked" : ""}><div><div class="t">${esc(i.text)}</div>${i.sub ? `<div class="sub">${esc(i.sub)}</div>` : ""}</div><button class="btn small ghost" data-remove="${esc(i.id)}" aria-label="Poista rivi">✕</button></label>`;
    return `
      <section>
        <div class="sec-head"><h2>Ostoslista</h2><div class="row-actions">${open.length ? `<button class="link" data-share-shop>Jaa</button>` : ""}${done.length ? `<button class="link" data-clear-done>Poista ruksitut</button>` : ""}</div></div>
        ${S.dbState === "none" ? dbNote() : offlineBanner()}
        <div class="card">
          ${items.length ? open.map(row).join("") + done.map(row).join("") : `<div class="pantry">Lista on tyhjä. Avaa resepti ja paina <b>Lisää ostoslistalle</b> – listalle tulee vain se, mitä ei ole kotona.</div>`}
        </div>
        <form class="addrow" data-addform><input class="search" type="text" placeholder="Lisää oma rivi, esim. banaanit" data-addtext aria-label="Uusi rivi" autocomplete="off" enterkeyhint="done" maxlength="120"><button class="btn primary" type="submit">Lisää</button></form>
        <p class="pantry">${PANTRY}</p>
      </section>`;
  }

  function setBadge(tabId, n) {

    document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadAll(); wakeSync(); } });
    window.addEventListener("online", () => loadAll());
    window.addEventListener("offline", () => { if (S.dbState === "ok") { S.dbState = "offline"; render(); } });
  }

  // ---------- Events ----------
  document.addEventListener("click", (e) => {
    const tu = e.target.closest("[data-toast-undo]");
    if (tu) { const fn = toastUndo; toastUndo = null; $("#toast").classList.remove("show"); if (fn) fn(); return; }
    const tt = e.target.closest("[data-theme-toggle]");
    if (tt) { theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]; store.set("creami.theme", theme); applyTheme(); return; }
    const t = e.target.closest("[data-pick-who],[data-step],[data-share],[data-share-shop],[data-delete],[data-undelete],[data-unfreeze],[data-unreview],[data-profile],[data-tab],[data-open],[data-close],[data-reroll],[data-cat],[data-freeze],[data-rate],[data-shop],[data-done],[data-star],[data-texture],[data-sweet],[data-review-cancel],[data-review-save],[data-remove],[data-clear-done],[data-hide],[data-unhide],[data-keep],[data-fav]");
    if (!t) return;
    const d = t.dataset;
    if (d.pickWho) { if (!PROFILES.includes(d.pickWho)) return; S.profile = d.pickWho; store.set("creami.profile", S.profile); S.firstRun = false; loadSeed(); render(); }
    else if (d.step != null) { const i = +d.step; if (S.stepsDone.has(i)) S.stepsDone.delete(i); else S.stepsDone.add(i); t.classList.toggle("done", S.stepsDone.has(i)); }
    else if (d.share) { const r = byId(d.share); if (r) shareRecipe(r); }
    else if ("shareShop" in d) { const open = S.shopping.filter((i) => !i.done); shareText("Ostoslista", ["Ostoslista (Creami):", ...open.map((i) => `☐ ${i.text}${i.sub ? " (" + i.sub + ")" : ""}`)].join("\n")); }
    else if (d.delete) { deleteRecipe(d.delete); }
    else if (d.undelete) { restoreRecipe(d.undelete); }
    else if (d.unfreeze) { removeFreezer(d.unfreeze); }
    else if (d.unreview) { removeReview(d.unreview); }
    else if (d.hide) { hideRecipe(d.hide); }
    else if (d.unhide) { savePrefs(S.profile, (p) => ({ hidden: without(p.hidden, d.unhide) })); toast("Palautettu"); }
    else if (d.keep) { keepRecipe(d.keep); }
    else if (d.fav) { toggleFav(d.fav); }
    else if (d.profile) { if (!PROFILES.includes(d.profile)) return; S.profile = d.profile; store.set("creami.profile", S.profile); loadSeed(); render(); }
    else if (d.tab) { S.tab = d.tab; render(); window.scrollTo(0, 0); }
    else if (d.open) { openRecipe(d.open); }
    else if ("close" in d) { closeTop(); }
    else if ("reroll" in d) { reroll(); }
    else if (d.cat) { S.cat = d.cat; render(); }
    else if (d.freeze) { addFreezer(byId(d.freeze)); }
    else if (d.rate) { openReview({ recipeId: d.rate, stars: 0, texture: "", sweetness: "", comment: "" }); }
    else if (d.shop) { const r = byId(d.shop); if (r) addToShopping(r); }
    else if (d.done) { const f = S.freezer.find((x) => x.id === d.done); if (f && byId(f.recipeId)) openRecipe(f.recipeId, { recipeId: f.recipeId, stars: 0, texture: "", sweetness: "", comment: "", freezerId: f.id }); }
    else if (d.star) { if (S.review) { S.review.stars = +d.star; render(); } }
    else if (d.texture) { if (S.review) { S.review.texture = S.review.texture === d.texture ? "" : d.texture; render(); } }
    else if (d.sweet) { if (S.review) { S.review.sweetness = S.review.sweetness === d.sweet ? "" : d.sweet; render(); } }
    else if ("reviewCancel" in d) { closeReview(); }
    else if ("reviewSave" in d) { saveReview(); }
    else if (d.remove) { e.preventDefault(); const gone = S.shopping.find((i) => i.id === d.remove); saveShopping(S.shopping.filter((i) => i.id !== d.remove)); if (gone) toast("Rivi poistettu", () => saveShopping([...S.shopping, gone])); }
    else if ("clearDone" in d) { const gone = S.shopping.filter((i) => i.done); saveShopping(S.shopping.filter((i) => !i.done)); toast("Ruksitut poistettu", () => saveShopping([...S.shopping, ...gone.filter((g) => !S.shopping.some((i) => i.id === g.id))])); }
  });
  document.addEventListener("change", (e) => {
    const c = e.target.closest("[data-check]");
    if (c) saveShopping(S.shopping.map((i) => i.id === c.dataset.check ? { ...i, done: c.checked } : i));
  });
  document.addEventListener("input", (e) => {
    if (e.target.matches("[data-search]")) { S.q = e.target.value; render(); }
    if (e.target.matches("[data-comment]") && S.review) S.review.comment = e.target.value;
  });
  document.addEventListener("submit", (e) => {
    const f = e.target.closest("[data-addform]"); if (!f) return;
    e.preventDefault();
    const inp = $("[data-addtext]", f), text = inp.value.trim().slice(0, 120); if (!text) return;
    inp.value = "";
    saveShopping([...S.shopping, { id: uid(), text, sub: "", done: false }]);
  });

  loadCache();
  render();
  connect().catch((e) => { console.error(e); S.dbState = S.recipes.length ? "offline" : "none"; render(); });
  if ("serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
})();
</script>
</body>
</html>
